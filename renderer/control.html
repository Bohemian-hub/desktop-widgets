<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>桌面组件控制台</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            background: #f6f8fb;
            color: #334155;
        }
        h1 { font-size: 15px; margin: 0 0 14px; }
        .cols { display: flex; gap: 14px; align-items: stretch; }
        .col {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
        }
        .col.left { flex: 0 0 248px; }
        .col.right { flex: 1; min-width: 0; }
        .col-head {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1px;
            margin: 0 2px 10px;
        }
        .col.right .col-head { margin-top: 2px; }

        /* 设置项行 */
        .setting {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            margin-bottom: 8px;
            border-radius: 11px;
            background: #f8fafc;
            border: 1px solid #eef2f7;
            font-size: 13px;
        }
        .setting:last-of-type { margin-bottom: 0; }
        .setting .txt { flex: 1; min-width: 0; }
        .setting .txt b { font-weight: 600; display: block; }
        .setting .txt span { color: #94a3b8; font-size: 11px; }
        .switch {
            position: relative;
            flex-shrink: 0;
            width: 38px;
            height: 21px;
            border-radius: 11px;
            background: #cbd5e1;
            cursor: pointer;
            transition: background .2s;
        }
        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 17px;
            height: 17px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
            transition: left .2s;
        }
        .switch.on { background: #4f8df7; }
        .switch.on::after { left: 19px; }

        /* 透明度滑块 */
        .alpha-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 11px;
            background: #f8fafc;
            border: 1px solid #eef2f7;
            font-size: 13px;
        }
        .alpha-row label { font-weight: 600; white-space: nowrap; }
        .alpha-row .val { color: #4f8df7; font-weight: 700; width: 36px; text-align: right; font-size: 12px; }
        input[type="range"] {
            flex: 1;
            height: 4px;
            appearance: none;
            -webkit-appearance: none;
            border-radius: 2px;
            background: #dbe4f0;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #4f8df7;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(79, 141, 247, .5);
            cursor: pointer;
        }

        /* 组件列表 */
        .witem {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            margin-bottom: 8px;
            border-radius: 11px;
            background: #f8fafc;
            border: 1px solid #eef2f7;
            font-size: 13px;
        }
        .witem .wic {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: #eaf2ff;
            color: #4f8df7;
        }
        .witem .wic svg { width: 15px; height: 15px; }
        .witem .info { flex: 1; min-width: 0; }
        .witem .info b { font-weight: 600; display: block; }
        .witem .info span { color: #94a3b8; font-size: 11px; }
        .witem button {
            flex-shrink: 0;
            border: 0;
            border-radius: 9px;
            padding: 6px 13px;
            font-size: 12px;
            cursor: pointer;
            background: #eaf2ff;
            color: #4f8df7;
        }
        .witem button:hover { background: #dbe8ff; }
        .witem button.hide { background: #f1f5f9; color: #64748b; }
        .witem button.hide:hover { background: #e2e8f0; }

        .actions { margin-top: 12px; display: flex; gap: 8px; }
        button.act {
            border: 0;
            border-radius: 9px;
            padding: 7px 16px;
            font-size: 12px;
            cursor: pointer;
            background: #eaf2ff;
            color: #4f8df7;
        }
        button.act:hover { background: #dbe8ff; }
        button.danger { background: #fee2e2; color: #dc2626; }
        button.danger:hover { background: #fecaca; }

        .hint {
            margin-top: 12px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.7;
        }
        .footer { margin-top: 14px; }
    </style>
</head>
<body>
    <h1>桌面组件 · 控制台</h1>
    <div class="cols">
        <!-- 左列：设置 -->
        <div class="col left">
            <div class="col-head">设 置</div>

            <div class="setting">
                <div class="txt">
                    <b>开机启动</b>
                    <span>登录 macOS 后自动运行</span>
                </div>
                <div class="switch" id="loginSwitch" title="切换开机启动"></div>
            </div>

            <div class="setting">
                <div class="txt">
                    <b>启动时打开控制台</b>
                    <span>应用启动后自动弹出本窗口</span>
                </div>
                <div class="switch" id="consoleSwitch" title="切换启动打开控制台"></div>
            </div>

            <div class="alpha-row">
                <label>透明度</label>
                <input type="range" id="alpha" min="0.15" max="1" step="0.05" value="0.5">
                <span class="val" id="alphaVal">50%</span>
            </div>

            <div class="setting">
                <div class="txt">
                    <b>壁纸模式</b>
                    <span>组件置于桌面图标/文件夹之下</span>
                </div>
                <div class="switch" id="modeSwitch" title="切换壁纸模式"></div>
            </div>

            <div class="setting">
                <div class="txt">
                    <b>交互锁定</b>
                    <span>组件不可点击，点击穿透到桌面</span>
                </div>
                <div class="switch" id="lockSwitch" title="切换交互锁定"></div>
            </div>

            <div class="footer">
                <button class="act danger" id="quit">退出</button>
            </div>
        </div>

        <!-- 右列：组件管理 -->
        <div class="col right">
            <div class="col-head">组件管理</div>
            <div id="list"></div>
            <div class="actions">
                <button class="act" id="reload">重新加载组件</button>
            </div>
            <div class="hint">
                拖拽组件顶部标题栏可移动窗口，位置自动保存。<br>
                新增组件：把组件文件夹放进 widgets/ 目录，<br>
                然后点「重新加载组件」即可，无需改任何代码。
            </div>
        </div>
    </div>

    <script>
        const api = window.desktopAPI;
        const listEl = document.getElementById('list');

        async function refresh() {
            const widgets = await api.listWidgets();
            listEl.innerHTML = widgets.map(w => `
                <div class="witem">
                    <div class="wic">${w.icon || ''}</div>
                    <div class="info">
                        <b>${w.name}</b>
                        <span>${w.folder}/</span>
                    </div>
                    <button class="${w.visible ? 'hide' : ''}" data-id="${w.id}">${w.visible ? '隐藏' : '显示'}</button>
                </div>
            `).join('');

            listEl.querySelectorAll('button[data-id]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await api.toggleWidget(btn.dataset.id);
                    refresh();
                });
            });
        }

        document.getElementById('reload').addEventListener('click', async () => {
            await api.reloadWidgets();
            refresh();
        });

        document.getElementById('quit').addEventListener('click', () => api.quit());

        // 全局透明度滑块：拖动实时广播到所有组件并持久化
        const alphaSlider = document.getElementById('alpha');
        const alphaVal = document.getElementById('alphaVal');
        (async () => {
            const a = await api.getAlpha();
            alphaSlider.value = a;
            alphaVal.textContent = Math.round(a * 100) + '%';
        })();
        alphaSlider.addEventListener('input', () => {
            const v = parseFloat(alphaSlider.value);
            alphaVal.textContent = Math.round(v * 100) + '%';
            api.setAlpha(v);
        });

        // 开关通用绑定：读初始值 -> 点击切换
        function bindSwitch(el, getter, setter) {
            (async () => {
                const on = await getter();
                el.classList.toggle('on', on);
            })();
            el.addEventListener('click', () => {
                const on = !el.classList.contains('on');
                el.classList.toggle('on', on);
                setter(on);
            });
        }

        // 壁纸模式
        bindSwitch(document.getElementById('modeSwitch'),
            () => api.getDesktopMode(), (v) => api.setDesktopMode(v));
        // 交互锁定
        bindSwitch(document.getElementById('lockSwitch'),
            () => api.getLockInteraction(), (v) => api.setLockInteraction(v));
        // 开机启动
        bindSwitch(document.getElementById('loginSwitch'),
            () => api.getLoginItem(), (v) => api.setLoginItem(v));
        // 启动时打开控制台
        bindSwitch(document.getElementById('consoleSwitch'),
            () => api.getOpenConsoleOnStart(), (v) => api.setOpenConsoleOnStart(v));

        // Dock 里切换组件状态时，控制台同步刷新
        if (api.onWidgetsChanged) api.onWidgetsChanged(refresh);

        refresh();
    </script>
</body>
</html>
